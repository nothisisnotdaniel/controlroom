# Builds ControlRoom for Windows x64 and macOS on Apple silicon from one release commit, in four jobs:
# - version checks the event and works out the release version and commit.
# - windows and macos both need only version, so the Windows and macOS builds run in parallel after version.
#   windows tests, packages and exercises the win-x64 ZIP; macos tests, publishes, signs, smoke-checks and packs
#   the osx-arm64 tarball and RoomKit.<version>.nupkg. Each build job reports the SHA-256 of the files it uploads
#   as job outputs (zip_sha256, tarball_sha256, roomkit_sha256), and uploads them as one artifact.
# - release needs version, windows and macos. It downloads both artifacts and checks the downloaded files' hashes
#   against the hashes the build jobs reported (exactly the three expected files, nothing else), then sums,
#   attests and publishes them. Only this job has write permissions, and it builds nothing itself.
# - A push to develop makes a prerelease vX.Y.(Z+1)-develop.<run number>, one patch above the highest
#   release tag (.github/scripts/develop-version.sh), on the pushed commit. A push that changes only
#   backlog.md or backlog/ is skipped (paths-ignore), so it makes no prerelease.
# - A merged pull request from develop into main, titled "release vX.Y.Z", makes a release: vX.Y.Z (and
#   its tag) on the merge commit (.github/scripts/release-version.sh). Closed-unmerged PRs, PRs from other
#   branches and fork PRs are skipped by the version job's if:, and its first step checks the same again.
# - After a proper release vX.Y.Z, every -develop prerelease at or below X.Y.Z is deleted with its tag
#   (.github/scripts/old-prereleases.sh). A failed prune only warns (continue-on-error); the release counts.
# - The release holds controlroom-<version>-osx-arm64.tar.gz (one top folder controlroom-<version>-osx-arm64/
#   with the self-contained publish output, wwwroot/ included), controlroom-<version>-win-x64.zip,
#   RoomKit.<version>.nupkg and SHA256SUMS, plus a build-provenance attestation for the three files (check one
#   with: gh attestation verify <tarball> --repo nothisisnotdaniel/controlroom).
#   scripts/launch-agent.sh install --release [vX.Y.Z] installs it.
# - RoomKit.<version>.nupkg is the shared server core (docs/roomkit.md), packed with the same version. Apps restore
#   it from a local folder feed filled with gh release download; no package registry, permission or secret is needed.
# - Once signing-cert.sha1 is committed, every macOS build is signed with that self-signed certificate (steps Sign
#   and Verify signature in the macos job; README "Signing"), and install --release and the updater refuse any build
#   that is not. The temporary signing keychain goes on the user keychain search list for the run
#   (.github/scripts/signing-keychain.sh). The signing secrets reach only the Sign step.
# Refs, PR fields, job outputs and the run number reach the shell only through environment variables (GITHUB_REF,
# GITHUB_SHA, GITHUB_RUN_NUMBER and the env: blocks), never through ${{ }} inside a run: script.
# Actions are pinned to full commit SHAs (the tag each one had is in the trailing comment), so a moved tag
# cannot run new code with the contents: write token.
name: Release

on:
  push:
    branches:
      - "develop"
    paths-ignore:
      - "backlog.md"
      - "backlog/**"
  pull_request:
    types:
      - "closed"
    branches:
      - "main"

permissions: {}

jobs:
  version:
    # Every push to develop runs; a pull_request event runs only for a merged PR from develop in this repository.
    if: github.event_name == 'push' || (github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository)
    # macos-15 is an Apple silicon (arm64) runner; the first step checks it.
    runs-on: macos-15
    permissions:
      contents: read
    outputs:
      release_version: ${{ steps.version.outputs.RELEASE_VERSION }}
      release_target: ${{ steps.version.outputs.RELEASE_TARGET }}
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_MERGED: ${{ github.event.pull_request.merged }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # No later step needs git credentials (gh uses GH_TOKEN), so the write token is not left in .git/config.
          persist-credentials: false
          # All history and tags: the tags are read by develop-version.sh and release-version.sh, and the
          # merge commit is checked against origin/main.
          fetch-depth: 0
          # A release PR builds its merge commit; empty for a push, which keeps the pushed commit.
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Check the event
        run: |
          if [ "$(uname -m)" != "arm64" ]; then
            echo "The runner is not arm64" >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$GITHUB_REF" != "refs/heads/develop" ]; then
              echo "Prereleases are made only for pushes to develop" >&2
              exit 1
            fi
            case "$GITHUB_SHA" in
              '' | *[!0-9a-f]*)
                echo "The pushed commit is not a lowercase hex commit id" >&2
                exit 1
                ;;
            esac
            if [ "${#GITHUB_SHA}" -ne 40 ]; then
              echo "The pushed commit is not 40 characters long" >&2
              exit 1
            fi
            if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
              echo "The checked-out commit is not the pushed commit" >&2
              exit 1
            fi
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            if [ "$PR_MERGED" != "true" ]; then
              echo "Pull request is not merged; nothing to release" >&2
              exit 1
            fi
            if [ "$PR_HEAD_REF" != "develop" ]; then
              echo "Release pull requests must come from develop" >&2
              exit 1
            fi
            if [ "$PR_HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
              echo "Release pull requests must come from this repository" >&2
              exit 1
            fi
            case "$MERGE_SHA" in
              '' | *[!0-9a-f]*)
                echo "The merge commit is not a lowercase hex commit id" >&2
                exit 1
                ;;
            esac
            if [ "${#MERGE_SHA}" -ne 40 ]; then
              echo "The merge commit is not 40 characters long" >&2
              exit 1
            fi
            if [ "$(git rev-parse HEAD)" != "$MERGE_SHA" ]; then
              echo "The checked-out commit is not the merge commit" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$MERGE_SHA" origin/main; then
              echo "The merge commit is not on main" >&2
              exit 1
            fi
          else
            echo "Only a push to develop or a merged release pull request makes a release" >&2
            exit 1
          fi

      - name: Version
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # Push to develop: one patch above the highest release tag, as a prerelease.
            if ! RELEASE_VERSION="$(git tag --list 'v*' | sh .github/scripts/develop-version.sh "$GITHUB_RUN_NUMBER")"; then
              echo "The run number does not make a develop version" >&2
              exit 1
            fi
            RELEASE_TARGET="$GITHUB_SHA"
          else
            if ! RELEASE_VERSION="$(git tag --list 'v*' | sh .github/scripts/release-version.sh "$PR_TITLE")"; then
              echo "The release pull request title must be exactly 'release vX.Y.Z' for a new version" >&2
              exit 1
            fi
            RELEASE_TARGET="$MERGE_SHA"
          fi
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TARGET=$RELEASE_TARGET" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      zip_sha256: ${{ steps.hash.outputs.zip_sha256 }}
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.release_version }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.version.outputs.release_target }}
          persist-credentials: false

      - name: Set up .NET on Windows
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Windows tests
        run: dotnet test -c Release

      - name: Build and smoke check the Windows ZIP
        run: ./.github/scripts/windows-release.ps1

      # The release job checks the downloaded ZIP against this hash, which travels as a job output, apart
      # from the artifact store.
      - name: Hash the verified ZIP
        id: hash
        shell: bash
        run: |
          ZIP_SHA256="$(sha256sum "dist/controlroom-$RELEASE_VERSION-win-x64.zip" | cut -d ' ' -f 1)"
          echo "zip_sha256=$ZIP_SHA256" >> "$GITHUB_OUTPUT"

      - name: Save the verified ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release
          path: dist/controlroom-${{ env.RELEASE_VERSION }}-win-x64.zip
          if-no-files-found: error
          compression-level: 0

  macos:
    needs: version
    runs-on: macos-15
    permissions:
      contents: read
    outputs:
      tarball_sha256: ${{ steps.hash.outputs.tarball_sha256 }}
      roomkit_sha256: ${{ steps.hash.outputs.roomkit_sha256 }}
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.release_version }}
    steps:
      - name: Check out the release commit on macOS
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.version.outputs.release_target }}
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      # The tests run on the normal build (no version override): they expect the version "dev".
      # MSBuild reads every environment variable as a property, ignoring case, so a $GITHUB_ENV name like
      # VERSION would become $(Version) here. That is why the names above are RELEASE_VERSION and
      # RELEASE_TARGET, which match no MSBuild property.
      - name: Test
        run: dotnet test -c Release

      - name: Publish
        run: dotnet publish src/ControlRoom.Server -c Release -r osx-arm64 --self-contained -p:Version="$RELEASE_VERSION" -o "$RUNNER_TEMP/publish"

      # Signing with the one self-signed certificate (no Developer ID, no notarization), so every build has the same
      # designated requirement and macOS keeps the permission the user granted once. It is off until
      # signing-cert.sha1 (the certificate's SHA-1 fingerprint) is committed at the repo root: then both secrets
      # must be set and the build must sign and verify. Missing means ad-hoc signed as before (only a warning);
      # an invalid file fails (.github/scripts/signing-cert.sh). The secrets reach only this step, through env:.
      # The p12 is decoded into $RUNNER_TEMP (0600) and deleted within the step; the key lives in a temporary
      # keychain with a random password. .github/scripts/signing-keychain.sh puts that keychain on the user search
      # list (codesign looks only there) and checks that it holds the pinned identity, so a wrong or key-less p12
      # fails with its own error; "Remove signing keychain" takes it off the list and deletes it even when a step fails.
      - name: Sign
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if ! SHA1="$(sh .github/scripts/signing-cert.sh signing-cert.sha1)"; then
            echo "signing-cert.sha1 is invalid; signing can't be turned off by a broken file" >&2
            exit 1
          fi
          if [ -z "$SHA1" ]; then
            echo "::warning::signing-cert.sha1 is missing, so this build is only ad-hoc signed"
            exit 0
          fi
          if [ -z "$SIGNING_CERT_P12" ] || [ -z "$SIGNING_CERT_PASSWORD" ]; then
            echo "signing-cert.sha1 is committed, but the SIGNING_CERT_P12 or SIGNING_CERT_PASSWORD secret is empty" >&2
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          P12="$RUNNER_TEMP/signing.p12"
          PUBLISH="$RUNNER_TEMP/publish"
          trap 'rm -f "$P12"' EXIT
          umask 077
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          printf '%s' "$SIGNING_CERT_P12" | base64 --decode > "$P12"
          chmod 600 "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # codesign finds an identity only in a keychain on the user search list, even with --keychain.
          sh .github/scripts/signing-keychain.sh add "$KEYCHAIN" || exit 1
          security import "$P12" -k "$KEYCHAIN" -f pkcs12 -P "$SIGNING_CERT_PASSWORD" -T /usr/bin/codesign > /dev/null
          rm -f "$P12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          if ! sh .github/scripts/signing-keychain.sh check "$KEYCHAIN" "$SHA1"; then
            echo "The SIGNING_CERT_P12 secret holds no code-signing identity with the fingerprint in signing-cert.sha1 ($SHA1)" >&2
            exit 1
          fi
          # The native libraries and createdump first, the server executable last (it seals the folder around it).
          for file in "$PUBLISH"/*.dylib "$PUBLISH/createdump"; do
            if [ ! -e "$file" ]; then
              continue
            fi
            codesign --force --options runtime --timestamp=none --keychain "$KEYCHAIN" --sign "$SHA1" "$file"
          done
          codesign --force --options runtime --timestamp=none --keychain "$KEYCHAIN" --sign "$SHA1" --identifier ControlRoom.Server --entitlements .github/signing/entitlements.plist -r='designated => identifier "ControlRoom.Server" and certificate leaf = H"'"$SHA1"'"' "$PUBLISH/ControlRoom.Server"

      - name: Verify signature
        run: |
          if ! SHA1="$(sh .github/scripts/signing-cert.sh signing-cert.sha1)"; then
            echo "signing-cert.sha1 is invalid" >&2
            exit 1
          fi
          if [ -z "$SHA1" ]; then
            echo "signing-cert.sha1 is missing; nothing to verify"
            exit 0
          fi
          PUBLISH="$RUNNER_TEMP/publish"
          REQUIREMENT="designated => identifier \"ControlRoom.Server\" and certificate leaf = H\"$SHA1\""
          # Each signed file: a strict verify pinned to the certificate, and the hardened runtime flag.
          for file in "$PUBLISH"/*.dylib "$PUBLISH/createdump" "$PUBLISH/ControlRoom.Server"; do
            if [ ! -e "$file" ]; then
              continue
            fi
            if [ "$file" = "$PUBLISH/ControlRoom.Server" ]; then
              codesign --verify --strict -R="identifier \"ControlRoom.Server\" and certificate leaf = H\"$SHA1\"" "$file"
            else
              codesign --verify --strict -R="certificate leaf = H\"$SHA1\"" "$file"
            fi
            INFO="$(codesign -dv "$file" 2>&1)"
            if ! printf '%s\n' "$INFO" | grep -Eq '^CodeDirectory .*flags=0x[0-9a-f]+\([^)]*runtime[^)]*\)'; then
              echo "$file is not signed with the hardened runtime" >&2
              exit 1
            fi
          done
          DESIGNATED="$(codesign -d -r- "$PUBLISH/ControlRoom.Server" 2>&1)"
          if ! printf '%s\n' "$DESIGNATED" | grep -Fxiq "$REQUIREMENT"; then
            echo "ControlRoom.Server does not have the pinned designated requirement" >&2
            exit 1
          fi
          # No Mach-O file may be left outside the signed set (top-level *.dylib, createdump, ControlRoom.Server).
          find "$PUBLISH" -type f > "$RUNNER_TEMP/publish-files"
          while IFS= read -r file; do
            NAME="${file#"$PUBLISH/"}"
            case "$NAME" in
              */*) ;;
              ControlRoom.Server | createdump | *.dylib) continue ;;
            esac
            case "$(file -b "$file")" in
              *Mach-O*)
                echo "$NAME is a Mach-O file that was not signed" >&2
                exit 1
                ;;
            esac
          done < "$RUNNER_TEMP/publish-files"
          rm -f "$RUNNER_TEMP/publish-files"

      # Runs even when an earlier step failed, so the private key never outlives the run's temporary keychain.
      - name: Remove signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/signing.p12"
          if [ -e "$RUNNER_TEMP/signing.keychain-db" ]; then
            sh .github/scripts/signing-keychain.sh remove "$RUNNER_TEMP/signing.keychain-db" || echo "::warning::Could not take the signing keychain off the keychain search list"
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db"
          fi

      - name: Smoke check the published server
        run: |
          ACTUAL="$("$RUNNER_TEMP/publish/ControlRoom.Server" version)"
          if [ "$ACTUAL" != "ControlRoom $RELEASE_VERSION" ]; then
            echo "ControlRoom.Server version printed '$ACTUAL', expected 'ControlRoom $RELEASE_VERSION'" >&2
            exit 1
          fi

      - name: Pack
        env:
          # No ._ AppleDouble entries for extended attributes: the tarball holds only the publish output.
          COPYFILE_DISABLE: "1"
        run: |
          NAME="controlroom-$RELEASE_VERSION-osx-arm64"
          mkdir -p "$RUNNER_TEMP/pack" dist
          mv "$RUNNER_TEMP/publish" "$RUNNER_TEMP/pack/$NAME"
          if [ ! -f "$RUNNER_TEMP/pack/$NAME/wwwroot/index.html" ]; then
            echo "The publish output has no wwwroot/index.html" >&2
            exit 1
          fi
          # The updater installs this copy of itself with the release it swaps in.
          cp scripts/updater.sh "$RUNNER_TEMP/pack/$NAME/updater.sh"
          chmod 0755 "$RUNNER_TEMP/pack/$NAME/updater.sh"
          tar -czf "dist/$NAME.tar.gz" -C "$RUNNER_TEMP/pack" "$NAME"

      - name: Pack RoomKit
        run: dotnet pack src/RoomKit -c Release -p:Version="$RELEASE_VERSION" -o dist

      # The release job checks the downloaded files against these hashes, which travel as job outputs, apart
      # from the artifact store.
      - name: Hash the macOS files
        id: hash
        run: |
          set -o pipefail
          TARBALL_SHA256="$(shasum -a 256 "dist/controlroom-$RELEASE_VERSION-osx-arm64.tar.gz" | cut -d ' ' -f 1)"
          ROOMKIT_SHA256="$(shasum -a 256 "dist/RoomKit.$RELEASE_VERSION.nupkg" | cut -d ' ' -f 1)"
          echo "tarball_sha256=$TARBALL_SHA256" >> "$GITHUB_OUTPUT"
          echo "roomkit_sha256=$ROOMKIT_SHA256" >> "$GITHUB_OUTPUT"

      - name: Save the verified macOS files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-release
          path: |
            dist/controlroom-${{ env.RELEASE_VERSION }}-osx-arm64.tar.gz
            dist/RoomKit.${{ env.RELEASE_VERSION }}.nupkg
          if-no-files-found: error
          compression-level: 0

  release:
    needs: [version, windows, macos]
    # Builds nothing: it checks, sums, attests and publishes the files the build jobs made.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.release_version }}
      RELEASE_TARGET: ${{ needs.version.outputs.release_target }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.version.outputs.release_target }}
          persist-credentials: false

      - name: Collect the build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: '*-release'
          merge-multiple: true
          path: dist

      # Exactly the three built files, each byte-identical to what its build job hashed before the upload. The
      # hashes come from the build jobs' outputs, a separate channel from the artifact store, and reach the shell
      # only through env:; each must be 64 lower-case hex characters before it is compared.
      - name: Check the downloaded files
        env:
          ZIP_SHA256: ${{ needs.windows.outputs.zip_sha256 }}
          TARBALL_SHA256: ${{ needs.macos.outputs.tarball_sha256 }}
          ROOMKIT_SHA256: ${{ needs.macos.outputs.roomkit_sha256 }}
        run: |
          TARBALL="controlroom-$RELEASE_VERSION-osx-arm64.tar.gz"
          ROOMKIT="RoomKit.$RELEASE_VERSION.nupkg"
          ZIP="controlroom-$RELEASE_VERSION-win-x64.zip"
          for name in "$TARBALL" "$ROOMKIT" "$ZIP"; do
            if [ ! -f "dist/$name" ] || [ -L "dist/$name" ]; then
              echo "The downloaded artifacts have no file $name" >&2
              exit 1
            fi
          done
          for entry in dist/* dist/.[!.]* dist/..?*; do
            if [ ! -e "$entry" ] && [ ! -L "$entry" ]; then
              continue
            fi
            case "${entry#dist/}" in
              "$TARBALL" | "$ROOMKIT" | "$ZIP") ;;
              *)
                echo "The downloaded artifacts hold an unexpected file: ${entry#dist/}" >&2
                exit 1
                ;;
            esac
          done
          check_hash() {
            NAME="$1"
            EXPECTED="$2"
            case "$EXPECTED" in
              '' | *[!0-9a-f]*)
                echo "The reported hash of $NAME is not 64 lower-case hex characters" >&2
                exit 1
                ;;
            esac
            if [ "${#EXPECTED}" -ne 64 ]; then
              echo "The reported hash of $NAME is not 64 lower-case hex characters" >&2
              exit 1
            fi
            ACTUAL="$(shasum -a 256 "dist/$NAME" | cut -d ' ' -f 1)"
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "dist/$NAME does not match the hash its build job reported" >&2
              exit 1
            fi
          }
          check_hash "$TARBALL" "$TARBALL_SHA256"
          check_hash "$ROOMKIT" "$ROOMKIT_SHA256"
          check_hash "$ZIP" "$ZIP_SHA256"

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 "controlroom-$RELEASE_VERSION-osx-arm64.tar.gz" > SHA256SUMS
          shasum -a 256 "RoomKit.$RELEASE_VERSION.nupkg" >> SHA256SUMS
          shasum -a 256 "controlroom-$RELEASE_VERSION-win-x64.zip" >> SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/controlroom-${{ env.RELEASE_VERSION }}-osx-arm64.tar.gz
            dist/RoomKit.${{ env.RELEASE_VERSION }}.nupkg
            dist/controlroom-${{ env.RELEASE_VERSION }}-win-x64.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Left unquoted below on purpose: when empty it must add no argument at all.
          PRERELEASE=""
          case "$RELEASE_VERSION" in
            *-*) PRERELEASE="--prerelease" ;;
          esac
          gh release create "v$RELEASE_VERSION" "dist/controlroom-$RELEASE_VERSION-osx-arm64.tar.gz" dist/SHA256SUMS "dist/RoomKit.$RELEASE_VERSION.nupkg" "dist/controlroom-$RELEASE_VERSION-win-x64.zip" --title "ControlRoom $RELEASE_VERSION" --generate-notes --target "$RELEASE_TARGET" $PRERELEASE

      # Housekeeping after a proper release: delete the -develop prereleases (and their tags) at or below the
      # release (.github/scripts/old-prereleases.sh). It runs only after the release was created, so
      # continue-on-error cannot hide a failed release, only a failed prune.
      - name: Prune old prereleases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RELEASE_VERSION" in
            *-*)
              echo "Version $RELEASE_VERSION is a prerelease; nothing to prune"
              exit 0
              ;;
          esac
          # run: is bash -e without pipefail: a failed listing must fail the step (a warning).
          set -o pipefail
          # Tag names are external text: they reach the shell only as data, and only exact
          # v<X.Y.Z>-develop.<n> tags at or below the release come out of the filter.
          gh release list --limit 1000 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease) | .tagName' |
            sh .github/scripts/old-prereleases.sh "$RELEASE_VERSION" |
            while IFS= read -r tag; do
              echo "Deleting prerelease $tag"
              gh release delete "$tag" --cleanup-tag --yes || echo "::warning::Could not delete prerelease $tag"
            done
